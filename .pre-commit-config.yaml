# Install with `uv run poe hooks`.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # Vendored files are kept exactly as published (their release hashes are checked),
      # so the whitespace fixers leave them alone.
      - id: trailing-whitespace
        exclude: &vendored ^src/casttrail/web/static/(css|js)/[^/]+\.min\.(css|js)$
      - id: end-of-file-fixer
        exclude: *vendored
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *vendored
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch=main]
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, security, docs, ci, test, build, chore, refactor, style, revert]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef # frozen: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 6f9f6fb27042eeb2c12163c94cf22289e9710eda # frozen: 44.239.1
    hooks:
      - id: renovate-config-validator
        name: Validate Renovate Config
        args: [--strict]
        files: ^\.github/renovate\.json$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run poe lint-fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run poe format
        language: system
        types: [python]
        pass_filenames: false
