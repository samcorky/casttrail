{% extends "base.html" %}
{% block title %}Change password · CastTrail{% endblock %}
{% block content %}
<h1 class="mb-4">Change password</h1>
{% if done %}
<div class="alert alert-success" role="status"><strong>Password changed.</strong> Your other browsers have been signed out.</div>
{% endif %}
{% if error %}
<div class="alert alert-danger" role="alert"><strong>{{ error }}</strong></div>
{% endif %}
<div class="card" style="max-width: 32rem">
  <div class="card-body">
    <form method="post" action="/account/password">
      <div class="mb-3">
        <label class="form-label" for="current_password">Current password</label>
        <input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="new_password">New password</label>
        <input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="new-password-help">
        <div class="form-text" id="new-password-help">At least 12 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">New password again</label>
        <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <button type="submit" class="btn btn-primary">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
