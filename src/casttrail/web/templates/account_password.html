{% extends "base.html" %}
{% block title %}Change password · CastTrail{% endblock %}
{% block content %}
<h1>Change password</h1>
{% if done %}
<p role="status"><strong>Password changed.</strong> Your other browsers have been signed out.</p>
{% endif %}
{% if error %}
<p role="alert"><strong>{{ error }}</strong></p>
{% endif %}
<article>
  <form method="post" action="/account/password">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="new-password-help">
    <small id="new-password-help">At least 12 characters.</small>
    <label for="confirm_password">New password again</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
    <button type="submit">Change password</button>
  </form>
</article>
{% endblock %}
