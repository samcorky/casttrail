<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="{{ url_for('static', path='css/pico.min.css') }}">
    <script defer src="{{ url_for('static', path='js/htmx.min.js') }}"></script>
    <title>{% block title %}CastTrail{% endblock %}</title>
  </head>
  <body>
    <header class="container">
      <nav aria-label="Main navigation">
        <ul><li><a href="/" class="contrast"><strong>CastTrail</strong></a></li></ul>
        {% if user %}
        {% set path = request.url.path %}
        <ul>
          <li><a href="/"{% if path == "/" %} aria-current="page"{% endif %}>Dashboard</a></li>
          {% if user.is_admin %}
          <li><a href="/admin/users"{% if path.startswith("/admin") %} aria-current="page"{% endif %}>Users</a></li>
          {% endif %}
          <li><a href="/account/password"{% if path == "/account/password" %} aria-current="page"{% endif %}>Password</a></li>
          <li><a href="/status"{% if path == "/status" %} aria-current="page"{% endif %}>Status</a></li>
          <li>
            <form method="post" action="/logout">
              <button type="submit" class="outline secondary">Sign out ({{ user.display_name }})</button>
            </form>
          </li>
        </ul>
        {% endif %}
      </nav>
    </header>
    <main class="container" id="main-content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
