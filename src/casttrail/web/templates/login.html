{% extends "base.html" %}
{% block title %}Sign in · CastTrail{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <img src="{{ url_for('static', path='img/logo.svg') }}" alt="CastTrail" width="72" height="72">
          <h1 class="h3 mt-2">Sign in</h1>
        </div>
        {% if error %}
        <div class="alert alert-danger" role="alert"><strong>{{ error }}</strong></div>
        {% endif %}
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
